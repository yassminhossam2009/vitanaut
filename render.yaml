services:
  - type: web
    name: vitanaut
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: VITANAUT_DB_PATH
        value: /var/data/vitanaut.db
    disk:
      name: vitanaut-data
      mountPath: /var/data
      sizeGB: 1
